<text x="48" y="40" fill="#9a6b00" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">İZMİR WATER / SCHEMATIC</text>
<text x="48" y="88" fill="#16181a" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Weather data → reservoir forecasts</text>
<text x="48" y="122" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">From source preparation to the reported 2025 forecasting workflow</text>
<text x="49" y="200" fill="#9a6b00" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">01</text>
