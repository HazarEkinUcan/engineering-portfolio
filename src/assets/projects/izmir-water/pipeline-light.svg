<text x="130" y="849" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Reported Ridge workflow · 2024-mean input assumptions</text>
<text x="48" y="958" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Prepared feature families are shown, not a claim that every fitted model used every column.</text>
<text x="48" y="982" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">2025 is a documented forecast scenario, not a measured outcome or live forecast.</text>
