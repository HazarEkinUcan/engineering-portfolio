<text x="49" y="448" fill="#9a6b00" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">03</text>
<rect x="110" y="413" width="842" height="99" rx="8" fill="#fdfcfa" stroke="#dcd9d2" stroke-width="1.5"/>
<text x="130" y="446" fill="#16181a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Weather gaps</text>
<text x="130" y="477" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Meteostat fallback · fill missing weather fields only</text>
