<text x="49" y="572" fill="#9a6b00" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">04</text>
<rect x="110" y="537" width="842" height="99" rx="8" fill="#fdfcfa" stroke="#dcd9d2" stroke-width="1.5"/>
<text x="130" y="570" fill="#16181a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Feature engineering</text>
<text x="130" y="601" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Month sin/cos · lag / rolling · per-capita / YoY fields</text>
<path d="M532 638 V657" fill="none" stroke="#55595e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="49" y="696" fill="#9a6b00" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">05</text>
