<text x="49" y="324" fill="#9a6b00" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">02</text>
<rect x="110" y="289" width="842" height="99" rx="8" fill="#fdfcfa" stroke="#dcd9d2" stroke-width="1.5"/>
<text x="130" y="322" fill="#16181a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Clean &amp; integrate</text>
<text x="130" y="353" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Monthly date alignment · combined project tables</text>
