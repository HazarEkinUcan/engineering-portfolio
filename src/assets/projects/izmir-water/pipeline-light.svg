<text x="130" y="694" fill="#16181a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Train &amp; compare</text>
<text x="130" y="725" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Linear · Ridge · Lasso / fill ratio and water volume</text>
