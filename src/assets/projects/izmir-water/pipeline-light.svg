<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="title desc">
<title id="title">Weather data → reservoir forecasts</title><desc id="desc">From source preparation to the reported 2025 forecasting workflow. Schematic based on supplied project sources, not measured results.</desc>
