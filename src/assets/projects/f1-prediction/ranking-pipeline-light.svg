<text x="384" y="224" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Qualifying + grid</text>
<text x="384" y="250" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Chronological row order</text>
<rect x="680" y="160" width="272" height="120" rx="8" fill="#fdfcfa" stroke="#dcd9d2" stroke-width="1.5"/>
<text x="700" y="193" fill="#16181a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Rolling features</text>
<text x="700" y="224" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Driver / team / circuit</text>
<text x="700" y="250" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">shift(1) → rolling(3)</text>
