<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="title desc">
<title id="title">One race. One ranking group.</title><desc id="desc">The model orders drivers relative to each other; it does not regress a finish number.. Schematic based on supplied project sources, not measured results.</desc>
