<text x="48" y="40" fill="#9a6b00" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">F1 / LEARNING TO RANK / SCHEMATIC</text>
<text x="48" y="88" fill="#16181a" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">One race. One ranking group.</text>
<text x="48" y="122" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">The model orders drivers relative to each other; it does not regress a finish number.</text>
