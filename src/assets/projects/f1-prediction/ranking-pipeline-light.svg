<text x="742" y="581" fill="#16181a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Relative</text>
<text x="742" y="611" fill="#16181a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">ordering</text>
<text x="70" y="692" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">A / B / C are schematic placeholders, not measured predictions.</text>
<path d="M500 709 V741" fill="none" stroke="#55595e" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="48" y="753" width="904" height="85" rx="8" fill="#fdfcfa" stroke="#dcd9d2" stroke-width="1.5"/>
<text x="68" y="786" fill="#16181a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Streamlit prediction view</text>
<text x="68" y="817" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Code sorts predicted scores ascending to display the order.</text>
<text x="48" y="888" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Source limitation: statusId is an outcome-related training feature; no leak-free model claim.</text>
<text x="48" y="912" fill="#55595e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Constructor rolling windows shift rows, not whole races. See temporal diagram and manifest.</text>
